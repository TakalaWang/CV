name: Build and deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
      - run: |
          grep -q "Output written on cv.pdf (1 page" cv.log || { echo "CV must stay on one page"; exit 1; }
          mkdir site
          cp cv.pdf site/Chung-Chun_Wang_CV.pdf
          cp index.html site/
          # Share preview: the top of page one, cropped to the 1.91:1 card ratio.
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftoppm -png -r 150 -f 1 -l 1 -singlefile -x 0 -y 0 -W 1240 -H 649 cv.pdf site/preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
